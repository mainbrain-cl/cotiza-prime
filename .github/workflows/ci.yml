name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # Pruebas de base de datos: Supabase local en Docker (entorno de PRUEBAS, nunca producción)
      - run: npx supabase start
      - run: npx supabase db reset
      - run: npm run test:db
      - run: npm run test:db:rollbacks
      - run: npx supabase stop
        if: always()
      - run: npm audit --audit-level=high
